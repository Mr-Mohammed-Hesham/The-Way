    <link rel="icon" type="image/png" sizes="64x64" href="/The-Way/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/The-Way/logo.png" />
    <link rel="icon" type="image/svg+xml" href="/The-Way/logo.svg" />
    <link rel="shortcut icon" href="/The-Way/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/The-Way/apple-touch-icon.png"
    />
    <link rel="manifest" href="/The-Way/manifest.json" />

    <script>
      // Ensure absolute URLs for social share crawlers that require fully qualified URLs
      (function() {
        try {
          var origin = window.location.origin || (window.location.protocol + '//' + window.location.host);
          var fullLogoUrl = origin + '/The-Way/logo.png';
          var ogImg = document.querySelector('meta[property="og:image"]');
          if (ogImg && !ogImg.content.startsWith('http')) ogImg.content = fullLogoUrl;
          var ogSec = document.querySelector('meta[property="og:image:secure_url"]');
          if (ogSec && !ogSec.content.startsWith('http')) ogSec.content = fullLogoUrl;
          var twImg = document.querySelector('meta[name="twitter:image"]');
          if (twImg && !twImg.content.startsWith('http')) twImg.content = fullLogoUrl;
          var linkImg = document.querySelector('link[rel="image_src"]');
          if (linkImg && !linkImg.href.startsWith('http')) linkImg.href = fullLogoUrl;
        } catch (e) {}
      })();
    </script>

    <!-- Theme & Mobile App Styling -->
    <meta name="theme-color" content="#004D99" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />
    <meta name="apple-mobile-web-app-title" content="The Way" />

    <!-- PWA Installation -->
    <script>
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();

        window.deferredPrompt = e;

        window.dispatchEvent(
          new CustomEvent('theway:pwa-ready', {
            detail: e,
          })
        );

        if (window.onBeforeInstallPrompt) {
          window.onBeforeInstallPrompt(e);
        }
      });

      window.addEventListener('appinstalled', () => {
        window.deferredPrompt = null;

        window.dispatchEvent(
          new CustomEvent('theway:pwa-installed')
        );
      });

      // Register Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/The-Way/sw.js')
            .then((registration) => {
              console.log(
                'The Way ServiceWorker registered:',
                registration.scope
              );
            })
            .catch((error) => {
              console.error(
                'ServiceWorker registration failed:',
                error
              );
            });
        });
      }
    </script>

    <!-- Typography -->
